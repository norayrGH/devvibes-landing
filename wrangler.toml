# devvibes.dev is served by a Worker (not Pages) with static assets.
#
# `not_found_handling` is "none" and routing for misses is handled in worker.js.
# The previous "single-page-application" value returned index.html with HTTP 200
# for every unmatched path, which made robots.txt/sitemap.xml/llms.txt look like
# they existed and served HTML in place of missing JS assets.

name = "devvibes-landing"
main = "worker.js"
compatibility_date = "2024-01-15"

[assets]
directory = "./dist"
binding = "ASSETS"
# Assets are served before the Worker runs; only genuine misses reach worker.js.
not_found_handling = "none"
