    <style>
      *{ margin:0; padding:0; box-sizing:border-box; }
      body{
        min-height:100vh; display:flex; align-items:center; justify-content:center;
        background:#08090C; color:#F4F5F7; text-align:center; padding:2rem;
        font-family:'JetBrains Mono',ui-monospace,monospace;
        background-image:

      }
      .code{ font-size:12px; letter-spacing:.3em; color:#7C828F; }

        font-family:'Space Grotesk',system-ui,sans-serif; font-weight:700;
        text-transform:uppercase; letter-spacing:-.035em; line-height:.92;

      }
      p{ color:#B9BDC6; font-size:14px; line-height:1.7; max-width:34rem; margin:0 auto; }
      a.btn{
        display:inline-flex; align-items:center; gap:.6rem; margin-top:2.25rem;
        padding:.95rem 1.6rem; border-radius:999px; text-decoration:none;
        font-size:12px; letter-spacing:.2em; text-transform:uppercase; font-weight:500;
        color:#08090C; background:linear-gradient(180deg,#FFE45C,#FFD60A);
        border:1px solid rgba(255,214,10,.5);
      }
      .mark{
        width:38px; height:38px; border-radius:9px; margin:0 auto;
        background:linear-gradient(135deg,#3B6BE4,#0A1B3D);
        display:flex; align-items:center; justify-content:center;
      }
