<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64" width="300" height="64" role="img" aria-label="DEVVIBES">
  <title>DEVVIBES logo — for light backgrounds</title>
  <defs>
    <linearGradient id="dvTileLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B6BE4"/>
      <stop offset="1" stop-color="#0A1B3D"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#dvTileLight)"/>
  <path fill="#FFFFFF" fill-rule="evenodd" d="M20 16h16c10 0 16 7 16 16s-6 16-16 16H20V16Zm8 7.5v17h7.5c5 0 8.5-3 8.5-8.5s-3.5-8.5-8.5-8.5H28Z"/>

  <!-- "DEV" is ink here rather than paper. The dark-background lockup uses
       #F4F5F7, which is invisible on white. -->
  <text x="80" y="43"
        font-family="'Space Grotesk','Space Grotesk Variable',system-ui,-apple-system,'Segoe UI',sans-serif"
        font-size="34" font-weight="700" letter-spacing="-1.2">
    <tspan fill="#08090C">DEV</tspan><tspan fill="#C2A40C">VIBES</tspan>
  </text>
</svg>
